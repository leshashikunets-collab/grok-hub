<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="Grok Hub"/>
  <link rel="manifest" href="manifest.json"/>
  <meta name="theme-color" content="#000000"/>
  <title>Grok Hub</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root, [data-theme="grok"]{--bg:#000;--panel:#111;--panel2:#1a1a1a;--border:#2a2a2a;--text:#f4f4f5;--muted:#8a8a8a;--accent:#fff;--accent2:#d4d4d4;--accent-soft:rgba(255,255,255,.08);--user:#1c1c1c;--grad:linear-gradient(135deg,#fff 0%,#9ca3af 100%);--send-fg:#000}
    [data-theme="mimo"]{--bg:#0d0d0f;--panel:#1b1b21;--panel2:#24242c;--border:#2a2a33;--text:#ececf1;--muted:#9b9ba7;--accent:#ff6900;--accent2:#ff9a3c;--accent-soft:rgba(255,105,0,.14);--user:#2a2a35;--grad:linear-gradient(135deg,#ff6900,#ff9a3c);--send-fg:#111}
    [data-theme="chatgpt"]{--bg:#212121;--panel:#2f2f2f;--panel2:#383838;--border:#424242;--text:#ececec;--muted:#b4b4b4;--accent:#10a37f;--accent2:#1a7f64;--accent-soft:rgba(16,163,127,.15);--user:#303030;--grad:linear-gradient(135deg,#10a37f,#1a7f64);--send-fg:#fff}
    [data-theme="gemini"]{--bg:#131314;--panel:#282a2c;--panel2:#303236;--border:#3c4043;--text:#e3e3e3;--muted:#9aa0a6;--accent:#8ab4f8;--accent2:#669df6;--accent-soft:rgba(138,180,248,.12);--user:#303134;--grad:linear-gradient(135deg,#4285f4,#8ab4f8);--send-fg:#111}
    [data-theme="claude"]{--bg:#1a1814;--panel:#2a2620;--panel2:#332f28;--border:#3d3830;--text:#f0ebe3;--muted:#a89f91;--accent:#d97757;--accent2:#e8b89a;--accent-soft:rgba(217,119,87,.14);--user:#322e28;--grad:linear-gradient(135deg,#d97757,#e8b89a);--send-fg:#111}
    *{box-sizing:border-box}
    body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);height:100dvh;overflow:hidden;transition:.2s}
    .app{display:flex;flex-direction:column;height:100dvh}
    .top{background:var(--panel);border-bottom:2px solid var(--accent);padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
    .logo{font-weight:900;font-size:1.05rem;margin-right:auto;letter-spacing:-.02em}
    .logo span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
    select.ctrl, .btn{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:8px 10px;font-size:.84rem;font-weight:600}
    .btn{cursor:pointer}.btn:hover{border-color:var(--accent);background:var(--accent-soft)}
    .btn.icon{width:40px;height:40px;padding:0;font-size:1rem}
    .modes{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;border-bottom:1px solid var(--border)}
    .chip{border:1px solid var(--border);background:var(--panel);border-radius:999px;padding:7px 13px;font-size:.82rem;white-space:nowrap;cursor:pointer;color:var(--text)}
    .chip.on{background:var(--accent);color:var(--send-fg);border-color:var(--accent);font-weight:700}
    .bar{padding:6px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--panel2);border-bottom:1px solid var(--border)}
    .status{font-size:.74rem;color:var(--muted);flex:1}
    .msgs{flex:1;overflow-y:auto;padding:12px 12px 110px}
    .inner{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
    .welcome{text-align:center;padding:28px 8px}
    .welcome h1{font-size:1.7rem;margin:0 0 8px}
    .welcome h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
    .welcome p{color:var(--muted);font-size:.9rem;line-height:1.5}
    .sg{display:grid;grid-template-columns:1fr;gap:8px;margin-top:16px}
    .sg button{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;color:var(--text);text-align:left}
    .msg{display:grid;grid-template-columns:34px 1fr;gap:10px}
    .av{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:.72rem;font-weight:800;background:var(--panel);border:1px solid var(--border)}
    .av.ai{background:var(--grad);color:var(--send-fg);border:none}
    .bubble{padding:11px 13px;border-radius:13px;line-height:1.58;word-break:break-word}
    .msg.user .bubble{background:var(--user)}
    .bubble pre{background:#0a0a0a;border:1px solid var(--border);border-radius:8px;padding:10px;overflow-x:auto;font-size:.82rem}
    .composer{position:fixed;left:0;right:0;bottom:0;padding:8px 12px 16px;background:linear-gradient(transparent,var(--bg) 28%)}
    .atts{max-width:820px;margin:0 auto 6px;display:flex;flex-wrap:wrap;gap:5px}
    .att{font-size:.74rem;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:4px 8px}
    .box{max-width:820px;margin:0 auto;background:var(--panel);border:2px solid var(--border);border-radius:20px;display:flex;gap:6px;padding:8px 10px;align-items:flex-end}
    .box:focus-within{border-color:var(--accent)}
    textarea{flex:1;border:none;outline:none;background:transparent;color:var(--text);font:inherit;font-size:16px;line-height:1.4;max-height:130px;resize:none;padding:6px 0}
    .send{width:42px;height:42px;border:none;border-radius:11px;background:var(--accent);color:var(--send-fg);font-size:1.1rem;font-weight:900;cursor:pointer}
    .send:disabled{opacity:.35}
    #fileIn{display:none}
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;place-items:center;padding:16px;z-index:99}
    .overlay.open{display:grid}
    .modal{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:18px;max-width:420px;width:100%}
    .modal h2{margin:0 0 12px;font-size:1.1rem}
    .modal label{display:block;font-size:.8rem;color:var(--muted);margin:10px 0 4px}
    .modal input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font:inherit}
    .modal .row{display:flex;gap:8px;margin-top:14px}
    .modal .row .btn{flex:1}
  </style>
</head>
<body data-theme="grok">
<div class="app">
  <div class="top">
    <div class="logo">⚡ <span>Grok Hub</span></div>
    <select class="ctrl" id="providerSel" title="AI provider"></select>
    <select class="ctrl" id="modelSel"></select>
    <select class="ctrl" id="themeSel" title="UI theme"></select>
    <button class="btn icon" id="settingsBtn" title="Settings">⚙</button>
  </div>
  <div class="modes" id="modes"></div>
  <div class="bar">
    <div class="status" id="status">Ready</div>
    <button class="btn" id="newChatBtn">+ New</button>
    <button class="btn" id="regenBtn">↻</button>
  </div>
  <div class="msgs" id="msgs"><div class="inner" id="inner"></div></div>
  <div class="composer">
    <div class="atts" id="atts"></div>
    <div class="box">
      <button class="btn icon" id="attachBtn">📎</button>
      <input type="file" id="fileIn" multiple accept=".txt,.md,.py,.js,.json,.csv,.html,.sql,.xml,.yaml,.yml,.java,.cpp,.go,.rs,.log"/>
      <textarea id="input" rows="1" placeholder="Ask anything..."></textarea>
      <button class="send" id="sendBtn">➤</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h2>Settings</h2>
    <label>Grok API key (console.x.ai)</label>
    <input type="password" id="grokKey" placeholder="xai-..."/>
    <label>MiMo API key</label>
    <input type="password" id="mimoKey" placeholder="tp-..."/>
    <p style="font-size:.78rem;color:var(--muted);margin:10px 0 0">Keys stay in your browser only.</p>
    <div class="row">
      <button class="btn" id="saveSettings">Save</button>
      <button class="btn" id="closeSettings">Close</button>
    </div>
  </div>
</div>

<script>
const PROVIDERS = {
  grok: {
    name: "Grok",
    url: "https://api.x.ai/v1/chat/completions",
    models: [
      {id:"grok-3-mini", name:"Grok 3 Mini"},
      {id:"grok-3", name:"Grok 3"},
      {id:"grok-2-1212", name:"Grok 2"}
    ],
    defaultKey: ""
  },
  mimo: {
    name: "MiMo",
    url: "https://token-plan-sgp.xiaomimimo.com/v1/chat/completions",
    models: [
      {id:"mimo-v2.5-pro", name:"MiMo Pro"},
      {id:"mimo-v2.5", name:"MiMo v2.5"}
    ],
    defaultKey: "tp-sul5stc88h1g1yd1s265411sw1qrmh1m4z53pi94jffwx7fe"
  }
};

const THEMES = [
  {id:"grok", name:"Grok"},
  {id:"mimo", name:"MiMo"},
  {id:"chatgpt", name:"ChatGPT"},
  {id:"gemini", name:"Gemini"},
  {id:"claude", name:"Claude"}
];

const MODES = {
  chat: {name:"Chat", icon:"💬", t:.7, tokens:2000,
    grok: "You are Grok — witty, direct, helpful. Reply in Russian if user writes in Russian.",
    mimo: "Ты — MiMo, полезный ассистент Xiaomi. Отвечай на русском.",
    sg:["What can you do?","Plan my day","Explain simply","Productivity tips"]},
  code: {name:"Code", icon:"💻", t:.3, tokens:4000,
    grok: "You are Grok, expert programmer. Clean code, comments, markdown blocks.",
    mimo: "Ты — эксперт-программист MiMo. Чистый код с комментариями.",
    sg:["Python REST API","Debug my code","Explain async/await","SQL JOIN query"]},
  creative: {name:"Create", icon:"✨", t:.9, tokens:3000,
    grok: "You are Grok, creative writer. Be bold and original.",
    mimo: "Ты — креативный писатель MiMo.",
    sg:["Sci-fi plot","Social media post","Startup names","RPG character"]},
  analyst: {name:"Analyze", icon:"📊", t:.4, tokens:3000,
    grok: "You are Grok analyst. Step by step, tables, pros/cons.",
    mimo: "Ты — аналитик MiMo. Структура, таблицы, выводы.",
    sg:["SWOT analysis","Compare in table","Business hypothesis","Research plan"]},
  grok: {name:"Grok mode", icon:"⚡", t:.85, tokens:2000,
    grok: "You are Grok: sharp humor, zero fluff, brutally honest but helpful.",
    mimo: "Ты — MiMo в стиле Grok: прямо, остроумно, без воды.",
    sg:["Explain inflation with wit","Should I learn Rust?","Bust a popular myth","Unusual life hack"]}
};

let provider = "grok";
let mode = "chat";
let theme = "grok";
let msgs = [];
let atts = [];
let busy = false;
let keys = {grok:"", mimo: PROVIDERS.mimo.defaultKey};

const $ = id => document.getElementById(id);

function load() {
  try {
    const s = JSON.parse(localStorage.getItem("grok_hub_v1") || "null");
    if (!s) return;
    provider = s.provider || provider;
    mode = s.mode || mode;
    theme = s.theme || theme;
    msgs = s.msgs || [];
    keys = {...keys, ...s.keys};
  } catch (_) {}
}
function save() {
  localStorage.setItem("grok_hub_v1", JSON.stringify({provider, mode, theme, msgs: msgs.slice(-60), keys}));
}

function getKey() {
  return keys[provider] || PROVIDERS[provider].defaultKey || "";
}

function init() {
  load();
  $("grokKey").value = keys.grok || "";
  $("mimoKey").value = keys.mimo || "";
  document.body.dataset.theme = theme;

  $("providerSel").innerHTML = Object.entries(PROVIDERS).map(([k,p]) =>
    `<option value="${k}">${p.name}</option>`).join("");
  $("themeSel").innerHTML = THEMES.map(t => `<option value="${t.id}">${t.name}</option>`).join("");

  $("providerSel").value = provider;
  $("themeSel").value = theme;
  renderModels();
  renderModes();
  render();

  $("providerSel").onchange = () => { provider = $("providerSel").value; renderModels(); render(); save(); };
  $("themeSel").onchange = () => { theme = $("themeSel").value; document.body.dataset.theme = theme; save(); };
  $("settingsBtn").onclick = () => $("overlay").classList.add("open");
  $("closeSettings").onclick = () => $("overlay").classList.remove("open");
  $("saveSettings").onclick = () => {
    keys.grok = $("grokKey").value.trim();
    keys.mimo = $("mimoKey").value.trim();
    $("overlay").classList.remove("open");
    save();
    render();
  };
  $("newChatBtn").onclick = () => { msgs = []; atts = []; renderAtts(); render(); save(); };
  $("regenBtn").onclick = () => send("", true);
  $("sendBtn").onclick = () => send();
  $("attachBtn").onclick = () => $("fileIn").click();
  $("fileIn").onchange = onFiles;
  $("input").onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } };
}

function renderModels() {
  const p = PROVIDERS[provider];
  $("modelSel").innerHTML = p.models.map(m => `<option value="${m.id}">${m.name}</option>`).join("");
}

function renderModes() {
  $("modes").innerHTML = "";
  Object.entries(MODES).forEach(([k, m]) => {
    const b = document.createElement("button");
    b.className = "chip" + (mode === k ? " on" : "");
    b.textContent = m.icon + " " + m.name;
    b.onclick = () => { mode = k; renderModes(); render(); save(); };
    $("modes").appendChild(b);
  });
}

function render() {
  const inner = $("inner");
  inner.innerHTML = "";
  const m = MODES[mode];
  const p = PROVIDERS[provider];

  if (!getKey() && provider === "grok") {
    inner.innerHTML = `<div class="welcome"><h1>⚡ <span>Grok Hub</span></h1>
      <p>Add your Grok API key in ⚙ Settings (get it at console.x.ai)<br>Or switch to MiMo — works out of the box.</p></div>`;
    return;
  }

  if (!msgs.length) {
    inner.innerHTML = `<div class="welcome"><h1>${m.icon} <span>${m.name}</span></h1>
      <p>${p.name} · themes · modes · files 📎<br>Works on phone without PC.</p><div class="sg" id="sg"></div></div>`;
    m.sg.forEach(t => {
      const b = document.createElement("button");
      b.textContent = t;
      b.onclick = () => send(t);
      $("sg").appendChild(b);
    });
    return;
  }
  msgs.forEach(x => addMsg(x.role, x.content, false));
  scroll();
}

function addMsg(role, content, anim = true) {
  const d = document.createElement("div");
  d.className = "msg " + role;
  const label = role === "user" ? "You" : (provider === "grok" ? "G" : "M");
  const html = role === "assistant" ? marked.parse(content || "") : esc(content).replace(/\n/g, "<br>");
  d.innerHTML = `<div class="av ${role === "assistant" ? "ai" : ""}">${label}</div><div class="bubble">${html}</div>`;
  $("inner").appendChild(d);
  if (anim) scroll();
  return d.querySelector(".bubble");
}

function esc(t) { return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function scroll() { $("msgs").scrollTop = $("msgs").scrollHeight; }

async function onFiles(e) {
  for (const f of e.target.files) {
    if (f.size > 300000) { alert(f.name + " too large"); continue; }
    try { atts.push({name: f.name, content: await f.text()}); } catch (_) {}
  }
  e.target.value = "";
  renderAtts();
}
function renderAtts() {
  $("atts").innerHTML = atts.map((a,i) =>
    `<span class="att">📎 ${a.name} <button class="btn" style="padding:0 4px;font-size:.7rem" onclick="rmAtt(${i})">×</button></span>`).join("");
}
function rmAtt(i) { atts.splice(i,1); renderAtts(); }

function buildContent(text) {
  const parts = atts.map(a => `[File: ${a.name}]\n\`\`\`\n${a.content}\n\`\`\``);
  if (text) parts.push(text);
  return parts.join("\n\n");
}

async function send(text, regen = false) {
  if (busy) return;
  const key = getKey();
  if (!key) { $("overlay").classList.add("open"); return; }

  const p = PROVIDERS[provider];
  const m = MODES[mode];
  let userText = regen ? "" : buildContent((text || $("input").value).trim());

  if (regen) {
    if (!msgs.length || msgs.at(-1).role !== "assistant") return;
    msgs.pop();
  } else {
    if (!userText) return;
    msgs.push({role: "user", content: userText});
    $("input").value = "";
    atts = [];
    renderAtts();
  }

  save();
  render();
  const bubble = addMsg("assistant", "");
  busy = true;
  $("sendBtn").disabled = true;
  $("status").textContent = p.name + " thinking...";

  const sys = m[provider] || m.grok;
  const apiMsgs = [{role: "system", content: sys}, ...msgs];

  try {
    const res = await fetch(p.url, {
      method: "POST",
      headers: {"Content-Type": "application/json", "Authorization": "Bearer " + key},
      body: JSON.stringify({
        model: $("modelSel").value,
        messages: apiMsgs,
        temperature: m.t,
        max_tokens: m.tokens,
        stream: true
      })
    });
    if (!res.ok) throw new Error(await res.text());

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "", reply = "";

    while (true) {
      const {value, done} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      const lines = buf.split("\n");
      buf = lines.pop() || "";
      for (const line of lines) {
        if (!line.startsWith("data: ")) continue;
        const payload = line.slice(6).trim();
        if (!payload || payload === "[DONE]") continue;
        try {
          const j = JSON.parse(payload);
          if (j.error) throw new Error(j.error.message || JSON.stringify(j.error));
          if (!j.choices || !j.choices.length) continue;
          const c = j.choices[0].delta?.content;
          if (c) { reply += c; bubble.innerHTML = marked.parse(reply); scroll(); }
        } catch (e) { if (e.message && !e.message.includes("JSON")) throw e; }
      }
    }
    msgs.push({role: "assistant", content: reply});
    save();
  } catch (e) {
    bubble.innerHTML = `<span style="color:#f87171">Error: ${esc(e.message)}</span>`;
  } finally {
    busy = false;
    $("sendBtn").disabled = false;
    $("status").textContent = "Ready · " + p.name;
  }
}

init();
</script>
</body>
</html>
